<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NRSuite Test Portal</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0d0d0f;
      color: #e8eaed;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(420px, 100%);
      padding: 22px;
      background: #181a1f;
      border: 1px solid #2a2e35;
      border-radius: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 14px; color: #9aa0a6; font-size: 14px; line-height: 1.5; }
    label { display: block; margin-top: 14px; font-size: 13px; color: #9aa0a6; }
    input {
      width: 100%;
      margin-top: 6px;
      padding: 13px;
      border: 1px solid #2a2e35;
      border-radius: 10px;
      background: #101216;
      color: #e8eaed;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #a3e635;
      color: #0d0d0f;
      font-size: 15px;
      font-weight: 700;
    }
    .warning {
      margin-top: 16px;
      padding: 10px 12px;
      border: 1px solid rgba(239, 68, 68, .35);
      border-radius: 10px;
      color: #fca5a5;
      background: rgba(239, 68, 68, .08);
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <h1>Authorized test portal</h1>
    <p>This page is part of an authorized security-awareness test.</p>
    <form method="POST" action="/login">
      <label for="password">Test password</label>
      <input id="password" name="password" type="password"
             autocomplete="off" required>
      <button type="submit">Continue</button>
    </form>
    <div class="warning">
      Do not enter a real password. Captured test data may be retained by NRSuite.
    </div>
  </main>
</body>
</html>
